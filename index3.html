<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-image: url("assets/web_art.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: white;
}

.nav {
    text-align: center;
    padding: 20px;
}

.nav a {
    display: inline-block;
    padding: 12px 24px;
    margin: 5px;
    background-color: rgba(0,0,0,1);
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

.nav a:hover {
    background-color: #333;
}

.gallery-container {
    max-width: 1200px;
    margin: 20px auto 50px auto;
    padding: 30px;
    background-color: rgba(0,0,0,1);
    border-radius: 10px;
    text-align: center;
}

.slide {
    display: none;
}

.slide img {
    width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 5px;
}

.caption {
    margin-top: 20px;
    font-size: 1.1rem;
    line-height: 1.6;
}

.controls {
    margin-top: 25px;
}

.controls button {
    padding: 12px 25px;
    font-size: 16px;
    margin: 0 10px;
    background: white;
    color: black;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.controls button:hover {
    background: #ccc;
}

.counter {
    margin-top: 15px;
    font-size: 1rem;
}
</style>

</head>
<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="index2.html">About</a>
    <a href="index4.html">Press</a>
</div>

<div class="gallery-container">

    <h1>Gallery</h1>

    <div class="slide">
        <img src="assets/live_taped_corridor.jpg" alt="Live Taped Video Corridor">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/lorna.jpg" alt="Lorna">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/hole_in_space.jpg" alt="Hole In Space">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/electronic_cafe.jpg" alt="Electronic Cafe">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/deep_contact.jpg" alt="Deep Contact">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/legible_city.jpg" alt="Legible City">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/mbcbftw.jpg" alt="My Boyfriend Came Back From The War">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/unmakeablelove.jpg" alt="Unmakeable Love">
        <div class="caption">caption</div>
    </div>

    <div class="slide">
        <img src="assets/simstalgia.jpg" alt="Simstalgia">
        <div class="caption">caption</div>
    </div>

    <div class="controls">
        <button onclick="changeSlide(-1)">◀ Previous</button>
        <button onclick="changeSlide(1)">Next ▶</button>
    </div>

    <div class="counter" id="counter"></div>

</div>

<script>
let slideIndex = 0;

const slides = document.querySelectorAll(".slide");
const counter = document.getElementById("counter");

function showSlide(index) {

    if (index >= slides.length) {
        slideIndex = 0;
    }

    if (index < 0) {
        slideIndex = slides.length - 1;
    }

    slides.forEach(slide => {
        slide.style.display = "none";
    });

    slides[slideIndex].style.display = "block";

    counter.textContent =
        (slideIndex + 1) + " / " + slides.length;
}

function changeSlide(n) {
    slideIndex += n;
    showSlide(slideIndex);
}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        changeSlide(1);
    }

    if (event.key === "ArrowLeft") {
        changeSlide(-1);
    }

});

showSlide(slideIndex);
</script>

</body>
</html>
